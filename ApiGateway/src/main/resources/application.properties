spring.application.name=ApiGateway

server.port=8084
eureka.client.service-url.defaultzone=http://localhost:8761/eureka

#configuration

#user service
spring.cloud.gateway.routes[0].id=UserService
spring.cloud.gateway.routes[0].uri=lb://UserService
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

#hotel service
spring.cloud.gateway.routes[0].id=HotelService
spring.cloud.gateway.routes[0].uri=lb://HotelService
spring.cloud.gateway.routes[0].predicates[0]=Path=/hotels/**

#rating servic
spring.cloud.gateway.routes[0].id=RatingService
spring.cloud.gateway.routes[0].uri=lb://RatingService
spring.cloud.gateway.routes[0].predicates[0]=Path=/ratings/**